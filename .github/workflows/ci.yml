name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Generation engine (JVM + Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # T1: -i (info logging) makes each test's println output — including WorldFingerprintTest's
      # `FINGERPRINT` lines — appear in the console of this one run, so the comparison step below
      # can read it back rather than paying for a second `--rerun-tasks` run of the same tests.
      # That took CI from three engine test runs (JVM, Wasm, and a rerun of each for the
      # fingerprint) to two.
      - name: JVM tests
        run: ./gradlew :worldgen:jvmTest -i --console=plain | tee jvm-test-output.log

      - name: WebAssembly tests
        run: ./gradlew :worldgen:wasmJsNodeTest -i --console=plain | tee wasm-test-output.log

      # The renderer is shared, so it has to keep compiling for the web target too even while
      # only Android and desktop consume it today.
      # The renderer and the save format are shared, so both have to keep working on every
      # target — a save that only round-trips on one platform would be worse than none.
      - name: Cartography tests (JVM + Wasm)
        run: ./gradlew :cartography:jvmTest :cartography:wasmJsNodeTest --console=plain

      # Comparing the JVM and Wasm fingerprints catches platform drift — a difference usually
      # signals a platform-dependent bug rather than a harmless variation. This comparison is
      # informational; a save carries the world, so platforms may differ. The fingerprints
      # themselves come from the two steps above's own console output, not a fresh test run.
      - name: JVM and Wasm generation comparison
        continue-on-error: true
        run: |
          grep 'FINGERPRINT' jvm-test-output.log | sed 's/^[[:space:]]*//' | sort -u > jvm-fingerprint.txt
          grep 'FINGERPRINT' wasm-test-output.log | sed 's/^[[:space:]]*//' | sort -u > wasm-fingerprint.txt

          echo "--- JVM ---";  cat jvm-fingerprint.txt
          echo "--- Wasm ---"; cat wasm-fingerprint.txt

          if [ ! -s jvm-fingerprint.txt ]; then
            echo "::warning::No fingerprint captured — the test did not run."
          elif ! diff -u jvm-fingerprint.txt wasm-fingerprint.txt; then
            echo "::warning::JVM and Wasm generate different worlds from the same seed. This is informational; review for unexpected platform drift."
          else
            echo "Fingerprints match."
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: worldgen/build/reports/tests/
          retention-days: 7

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew :desktop:compileKotlin :desktop:test --console=plain

      # C3: the interface's browser tests were run locally before merges and nowhere else, so a
      # break in the wasm half of `:ui` reached main unseen. They run on Karma with a headless
      # Chrome, which `ubuntu-latest` ships and points `CHROME_BIN` at, so the runner needs nothing
      # installed. Its own step rather than joined to the one above: a Karma failure and a JVM
      # failure read differently and should not share a line in the log.
      - name: Interface tests (headless browser)
        run: ./gradlew :ui:wasmJsTest --console=plain
