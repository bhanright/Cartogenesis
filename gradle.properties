org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The one place the release version is declared. `desktop/build.gradle.kts` reads it for the
# installer and the portable build, so a release is renumbered here and nowhere else. Previously it
# lived only in the packaging block, and copies of the artefacts were hand-renamed to 1.2.0 and
# 1.2.2 while the build still said 1.0.0 - one of those zips turned out to be byte-identical to the
# 1.0.0 one.
cartogenesisVersion=3.2.0-dev

# Gradle file-system watching holds build directories open on Windows, and two per-merge runs on
# 2026-09-12 died with "Unable to delete directory" under it. Off costs a few seconds of scanning.
org.gradle.vfs.watch=false

# Kotlin/Wasm's incremental compilation, off. Its cache for cartography's test executable was left
# naming a standard-library function it no longer held ("Key ic#69:kotlin.text/split ... is missing
# in the map") after a change to cartography's own sources, and the link then failed on every run
# until the cache was deleted by hand; seen twice on 2026-09-25 on Kotlin 2.4.10. A clean build
# (as CI always is) never meets it, and a full link costs a few seconds more per module.
kotlin.incremental.wasm=false
