name: Feature suggestion
description: Something the application should be able to do.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        What is already planned is on the roadmap at cartogenesis.com.

        Without a GitHub account, send a suggestion to dev@cartogenesis.com.
  - type: textarea
    id: want
    attributes:
      label: What you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to do that the application makes hard or impossible.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which map style or view it belongs to
      description: Or which part of the application, if it is not about the map.
      placeholder: The rainfall view
