name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step under `bash -eo pipefail`. With no shell named, GitHub runs a step as `bash -e`,
# which has no pipefail, so a piped step takes the status of its last command: two engine test
# steps that were piped into `tee` stayed green when a test failed.
defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Generation engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests
        run: ./gradlew :worldgen:jvmTest --console=plain

      # The renderer and the save format, which every picture and every save goes through.
      - name: Cartography tests
        run: ./gradlew :cartography:jvmTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: worldgen/build/reports/tests/
          retention-days: 7

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew :desktop:compileKotlin :desktop:test --console=plain

      # The interface's tests on the JVM, where the desktop app runs them. Nothing else runs them:
      # `:ui` has no audit tier.
      - name: Interface tests (JVM)
        run: ./gradlew :ui:jvmTest --console=plain
