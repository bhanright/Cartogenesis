name: Nightly audit

# T1: the audit tier — DebugMapDump, StageProfileTest, GenerationSpeedTest, DesertCauseTest,
# ColdCapReportTest, ErosionConvergenceTest, the 2048-scale cases split into *AuditTest classes,
# the desktop module's 2048/4096 exports, and since T5 every render harness and printed report
# that asserts nothing, `:cartography`'s among them. These are excluded from `jvmTest`/`test` (see
# the three modules' build scripts) so the per-merge suite stays fast;
# this workflow is what still runs them, once a day, so a regression in the parts CI no longer
# covers is still caught within a day rather than only when someone remembers `gradlew audit`.

on:
  schedule:
    # 04:17 UTC, off the hour so it does not queue alongside every other project's midnight job.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Audit tier (worldgen + cartography + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Unqualified, this runs the `audit` task in every subproject that declares one —
      # `:worldgen:audit`, `:cartography:audit` and `:desktop:audit` today — the same way
      # `gradlew audit` does locally, one after another: two of them side by side have taken this
      # runner's 16 GB down, and the root build script orders them.
      - name: Audit tier
        run: ./gradlew audit --console=plain

      # T3: a red tier is only useful if it can be read. The badge in `README.md` says whether
      # last night passed; this says what failed, on the run's own summary page, so a red is a
      # line of text rather than a download. Read from the JUnit XML the Test tasks always write
      # (`build/test-results/audit/`) rather than from the console log, because that is the one
      # place the class and case names are structured; `if: always()` because the interesting
      # case is the one where the step above failed.
      - name: What failed
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          failed, cases, suites = [], 0, 0
          for path in sorted(glob.glob("*/build/test-results/audit/*.xml")):
              suites += 1
              for case in ET.parse(path).getroot().iter("testcase"):
                  cases += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append("%s.%s" % (case.get("classname", "?"), case.get("name", "?")))

          print("## Audit tier")
          if not suites:
              print("No test results were written: the tier did not get as far as running.")
          elif failed:
              print("**%d of %d cases red** in %d classes: %s"
                    % (len(failed), cases, suites, "; ".join(failed)))
          else:
              print("All %d cases green in %d classes." % (cases, suites))
          PY

      - name: Upload audit reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tier-output
          path: |
            worldgen/build/reports/tests/
            worldgen/build/maps/
            cartography/build/reports/tests/
            desktop/build/reports/tests/
            desktop/build/exports/
            desktop/build/styles/
            desktop/build/w3-crops/
            desktop/build/w4-crops/
          retention-days: 14
          if-no-files-found: ignore
