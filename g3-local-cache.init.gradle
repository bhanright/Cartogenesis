gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.class.name.contains('Kotlin2JsCompile') }.each { task ->
        def original = task.libraries.files
        def mirrored = original.collect { source ->
            if (!source.name.endsWith('.klib') || !source.isFile()) return source
            def destination = new File(rootProject.projectDir, 'build/g3-unpacked-klibs/' + Integer.toHexString(source.absolutePath.hashCode()) + '/' + source.name)
            destination.mkdirs()
            new java.util.zip.ZipFile(source).withCloseable { archive ->
                archive.entries().each { entry ->
                    def output = destination.toPath().resolve(entry.name).normalize()
                    if (!output.startsWith(destination.toPath())) throw new IOException('Invalid archive path')
                    if (entry.directory) java.nio.file.Files.createDirectories(output)
                    else {
                        java.nio.file.Files.createDirectories(output.parent)
                        archive.getInputStream(entry).withCloseable { input ->
                            java.nio.file.Files.copy(input, output, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        }
                    }
                }
            }
            return destination
        }
        task.libraries.setFrom(mirrored)
    }
}
