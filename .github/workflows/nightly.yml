name: Nightly audit

# T1: the audit tier — DebugMapDump, StageProfileTest, GenerationSpeedTest, DesertCauseTest,
# ColdCapReportTest, ErosionConvergenceTest, the 2048-scale cases split into *AuditTest classes,
# and the desktop module's 2048/4096 exports. These are excluded from `jvmTest`/`test` (see
# `worldgen/build.gradle.kts` and `desktop/build.gradle.kts`) so the per-merge suite stays fast;
# this workflow is what still runs them, once a day, so a regression in the parts CI no longer
# covers is still caught within a day rather than only when someone remembers `gradlew audit`.

on:
  schedule:
    # 04:17 UTC, off the hour so it does not queue alongside every other project's midnight job.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Every `run:` step under `bash -eo pipefail` rather than GitHub's unspecified default, `bash -e`,
# so that a step which pipes a command fails when the command does, not only when the last one does.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit tier (worldgen + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Unqualified, this runs the `audit` task in every subproject that declares one —
      # `:worldgen:audit` and `:desktop:audit` today — the same way `gradlew audit` does locally.
      # --continue so that one project's red does not keep Gradle from starting the other's tier.
      # The init script writes down, before anything runs, every class the tier is to run, which
      # is what the summary below holds the results against.
      - name: Audit tier
        id: tier
        run: ./gradlew audit --continue --init-script .github/audit-tier.init.gradle.kts --console=plain

      # T3: a red tier is only useful if it can be read. The badge in `README.md` says whether
      # last night passed; this says what failed, on the run's own summary page, so a red is a
      # line of text rather than a download. Read from the JUnit XML the Test tasks always write
      # rather than from the console log, because that is the one place the class and case names
      # are structured; `if: always()` because the interesting case is the one where the step
      # above failed. It fails itself when a planned class wrote no result, which is what a worker
      # killed part-way through leaves and a count of the files present reads as green, and when
      # the step above failed although the results show nothing wrong.
      - name: What failed
        if: always()
        env:
          AUDIT_TIER_OUTCOME: ${{ steps.tier.outcome }}
        run: python3 .github/scripts/audit_summary.py

      - name: Upload audit reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tier-output
          path: |
            build/audit-tier-plan.tsv
            worldgen/build/reports/tests/
            worldgen/build/maps/
            desktop/build/reports/tests/
            desktop/build/exports/
          retention-days: 14
          if-no-files-found: ignore
