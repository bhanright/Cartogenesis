name: Nightly audit

# T1: the audit tier — DebugMapDump, StageProfileTest, GenerationSpeedTest, DesertCauseTest,
# ColdCapReportTest, ErosionConvergenceTest, the 2048-scale cases split into *AuditTest classes,
# the desktop module's 2048/4096 exports, and since T5 every render harness and printed report
# that asserts nothing, `:cartography`'s among them. These are excluded from `jvmTest`/`test` (see
# the three modules' build scripts) so the per-merge suite stays fast;
# this workflow is what still runs them, once a day, so a regression in the parts CI no longer
# covers is still caught within a day rather than only when someone remembers `gradlew audit`.
#
# One job per module's audit task, each on a runner of its own. In one job, one after another,
# the three came to about five hours on the hosted runner against its six-hour limit on a job:
# the last green run took 2 h 37 min for two of them. Apart, the longest is `:worldgen:audit` on
# its own, and no job holds more than one task's worlds, which is also what keeps each inside the
# runner's 16 GB. A plan job first writes down what the three are to run, and a last job gathers
# all their results and holds them to that plan.

on:
  schedule:
    # 04:17 UTC, off the hour so it does not queue alongside every other project's midnight job.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Every `run:` step under `bash -eo pipefail` rather than GitHub's unspecified default, `bash -e`,
# so that a step which pipes a command fails when the command does, not only when the last one does.
defaults:
  run:
    shell: bash

jobs:
  # What the whole tier is to run, written once, before any of it starts, by the same init script
  # a local `gradlew audit` can take: every entry of each `audit` task's include filter. Once
  # rather than per job, so that a job that never starts, or dies before Gradle has chosen its
  # tests, still has its classes on the list the summary holds the results to. `--dry-run` fixes
  # the task graph, which is when the script writes, and runs nothing.
  plan:
    name: Plan the audit tier
    runs-on: ubuntu-latest
    # A configuration of the build and nothing else, a few minutes with a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write down every class the tier is to run
        run: |
          ./gradlew audit --dry-run --init-script .github/audit-tier.init.gradle.kts --console=plain
          test -s build/audit-tier-plan.tsv
          cat build/audit-tier-plan.tsv

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: audit-plan
          path: build/audit-tier-plan.tsv
          retention-days: 14
          if-no-files-found: error

  # The generator's tier: its 2048 and 4096 reports, the stage profile and the render harnesses.
  # Measured at 118 min on the sixteen-thread development machine beside the other two tiers (the
  # T5 run); at the hosted runner's 1.6 times that is about 190 min. 300 gives it half again, and
  # stays an hour under the six-hour ceiling on a hosted job.
  worldgen:
    name: Audit tier, the generator
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Audit tier
        id: tier
        run: ./gradlew :worldgen:audit --console=plain

      # How the task ended, written beside the results so that the summary reads it from the
      # same place: a worker that died in the tier's last class leaves results that look finished,
      # and only this says otherwise. Written whatever happened, a cancellation by the timeout
      # included; a job that never got this far leaves no file, which the summary reads as red.
      - name: Record how the tier ended
        if: always()
        run: |
          mkdir -p build
          echo "${{ steps.tier.outcome }}" > build/audit-outcome-worldgen.txt

      - name: Upload the generator's results, reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tier-worldgen
          path: |
            build/audit-outcome-worldgen.txt
            worldgen/build/test-results/audit/
            worldgen/build/reports/tests/
            worldgen/build/known-failures/
            worldgen/build/maps/
            desktop/build/w3-crops/
          retention-days: 14
          if-no-files-found: ignore

  # The drawing's tier: the render harnesses and the geometry census at 2048, seven worlds and a
  # 1024 twin wherever a comb is found. 7.5 min for the harnesses in the T5 run and 11 min for the
  # census on the development machine, so about 30 min on the hosted runner; 60 is twice that.
  cartography:
    name: Audit tier, the drawing
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Audit tier
        id: tier
        run: ./gradlew :cartography:audit --console=plain

      - name: Record how the tier ended
        if: always()
        run: |
          mkdir -p build
          echo "${{ steps.tier.outcome }}" > build/audit-outcome-cartography.txt

      - name: Upload the drawing's results, reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tier-cartography
          path: |
            build/audit-outcome-cartography.txt
            cartography/build/test-results/audit/
            cartography/build/reports/tests/
            cartography/build/known-failures/
            cartography/build/geometry-census/
            desktop/build/w4-crops/
          retention-days: 14
          if-no-files-found: ignore

  # The desktop's tier: the 2048 and 4096 exports and the galleries. 63 min on the development
  # machine in the T5 run, so about 100 min on the hosted runner; 180 is most of twice that.
  desktop:
    name: Audit tier, the desktop
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Audit tier
        id: tier
        run: ./gradlew :desktop:audit --console=plain

      - name: Record how the tier ended
        if: always()
        run: |
          mkdir -p build
          echo "${{ steps.tier.outcome }}" > build/audit-outcome-desktop.txt

      - name: Upload the desktop's results, reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-tier-desktop
          path: |
            build/audit-outcome-desktop.txt
            desktop/build/test-results/audit/
            desktop/build/reports/tests/
            desktop/build/known-failures/
            desktop/build/exports/
            desktop/build/styles/
          retention-days: 14
          if-no-files-found: ignore

  # T3: a red tier is only useful if it can be read. The badge in `README.md` says whether last
  # night passed; this says what failed, on the run's own summary page, so a red is a line of text
  # rather than a download. Read from the JUnit XML the Test tasks always write rather than from a
  # console log, because that is the one place the class and case names are structured; `always()`
  # because the interesting case is the one where a tier failed. It fails when a planned class wrote
  # no result, which is what a worker killed part-way through leaves and a count of the files present
  # reads as green; when a case was skipped with no reason, which is how a dying worker's last case
  # is written; when a tier's Gradle step did not succeed although its results show nothing wrong;
  # and when a job ended in anything but success, or left no word of how its tier ended.
  summary:
    name: What failed
    needs: [plan, worldgen, cartography, desktop]
    if: always()
    runs-on: ubuntu-latest
    # Two downloads and a script over a few hundred XML files.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download the plan
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: audit-plan
          path: build

      # Each tier's artifact holds its files at their paths from the repository root — an upload's
      # root is the common ancestor of what it matched, and each names a file under `build/` and
      # others under a module — so the three merge into the checkout where a local `gradlew audit`
      # leaves them. A tier that uploaded nothing is missing here, and its planned classes with it.
      - name: Download every tier's results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: audit-tier-*
          merge-multiple: true
          path: .

      # How each job ended by GitHub's own account as well as by the tier's record of its Gradle
      # step: a job cancelled, timed out or lost with its runner may have uploaded nothing at all.
      - name: What failed
        env:
          AUDIT_JOB_RESULTS: >-
            plan=${{ needs.plan.result }},
            worldgen=${{ needs.worldgen.result }},
            cartography=${{ needs.cartography.result }},
            desktop=${{ needs.desktop.result }}
        run: python3 .github/scripts/audit_summary.py
